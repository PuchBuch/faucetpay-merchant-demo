[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faucetpay-merchant-demo"
version = "0.1.0"
description = "Demo Flask shop that accepts crypto payments via FaucetPay Merchant"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "PuchBuch" }]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "python-dotenv>=1.0",  # lets `flask run` load .env
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["shop"]

[tool.setuptools.package-data]
shop = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
